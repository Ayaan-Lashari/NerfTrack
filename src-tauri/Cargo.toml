[package]
name = "nerfify"
version = "0.1.0"
description = "Nerfify local Codex usage monitor"
authors = ["Nerfify"]
edition = "2021"
rust-version = "1.77.2"
default-run = "nerfify"
build = "build.rs"

[lib]
name = "nerfify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nerfify"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
